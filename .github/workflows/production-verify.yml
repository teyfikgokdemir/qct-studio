name: Production Verification

on:
  workflow_run:
    workflows: ["Cloudflare Pages Build Verification"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: qct-studio-production-verification
  cancel-in-progress: true

jobs:
  verify-production:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployed production
        run: node scripts/verify-production.mjs
